
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramphony - Music Player</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app">

    <!-- SIDEBAR DESKTOP -->
    <aside class="sidebar">
        <h1 class="logo">Ramphony</h1>

        <nav class="side-nav">
            <a href="index.html" class="active">Home</a>
            <a href="pages/about.html">About</a>
            <a href="#playlist">Daftar putar</a>
        </nav>

        <p class="copyright">© 2026 - Pemrograman Web</p>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="main-content">

        <header class="topbar">
            <h1 class="mobile-logo">Ramphony</h1>
            <span class="topbar-label">Pemutar Musik</span>
            <a href="pages/form-data.html" class="register">
                Register
            </a>
        </header>

        <div class="workspace">

            <!-- PANEL PEMUTAR -->
            <section class="player-panel">

                <div class="lcd-frame">
                    <div class="lcd-screen">

                        <!-- LCD STATUS -->
                        <div class="lcd-status">
                            <div class="lcd-tags">
                                <span class="music-note">♫</span>
                                <span class="lcd-tag">MP3</span>
                                <span class="lcd-tag">NOR</span>
                            </div>
                            <span class="lcd-tag">BAT</span>
                        </div>

                        <!-- LCD DISPLAY -->
                        <div class="lcd-display">

                            <div class="lcd-title-wrap">
                                <div id="title" class="lcd-title">
                                    Belum ada lagu
                                </div>
                            </div>

                            <div class="lcd-progress">
                                <span id="cur">0:00</span>
                                <input
                                    type="range"
                                    id="seek"
                                    min="0"
                                    max="1000"
                                    value="0"
                                    aria-label="Posisi lagu"
                                >
                                <span id="dur">0:00</span>
                            </div>

                            <div class="lcd-bottom">
                                <div class="lcd-info">
                                    <span id="lcd-play-state">▶</span>
                                    <span>◀))</span>
                                    <span id="lcd-volume">80</span>
                                </div>

                                <div class="visualizer" id="visualizer">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- KONTROL MOBILE -->
                <div class="mobile-controls">
                    <button id="mobile-shuf" class="control-btn" aria-label="Acak">⤨</button>
                    <button id="mobile-prev" class="control-btn" aria-label="Sebelumnya">◀Ⅰ</button>
                    <button id="mobile-play" class="control-btn primary" aria-label="Putar">▶</button>
                    <button id="mobile-next" class="control-btn" aria-label="Berikutnya">Ⅰ▶</button>
                    <button id="mobile-rep" class="control-btn" aria-label="Ulangi">⇄</button>
                </div>

            </section>

            <!-- PLAYLIST -->
            <section class="playlist-panel" id="playlist">

                <div class="playlist-header">
                    <h2 id="count">Daftar putar</h2>

                    <div class="playlist-actions">
                        <button id="demo" class="btn-demo">
                            Coba demo
                        </button>

                        <button id="pick" class="btn-add">
                            Tambah lagu
                        </button>
                    </div>
                </div>

                <ul id="ul" class="track-list"></ul>

                <div class="drop-zone">
                    Seret berkas audio ke halaman ini
                    untuk menambah lagu.
                </div>

                <input
                    type="file"
                    id="file"
                    accept="audio/*"
                    multiple
                    hidden
                >

            </section>

        </div>
    </main>
</div>

<!-- BOTTOM PLAYER DESKTOP -->
<footer class="bottom-player">

    <div class="now-playing">
        <div class="song-icon" id="ini">R</div>

        <div class="song-meta">
            <div id="bottom-title">Belum ada lagu</div>
            <small id="sub">Tambahkan lagu</small>
        </div>
    </div>

    <div class="bottom-center">

        <div class="desktop-controls">
            <button id="shuf" aria-label="Acak">⤨</button>
            <button id="prev" aria-label="Sebelumnya">◀Ⅰ</button>
            <button id="play" class="main-play" aria-label="Putar">▶</button>
            <button id="next" aria-label="Berikutnya">Ⅰ▶</button>
            <button id="rep" aria-label="Ulangi">⇄</button>
        </div>

        <div class="bottom-seek">
            <span id="bottom-cur">0:00</span>
            <div class="progress-track">
                <div id="bottom-progress"></div>
            </div>
            <span id="bottom-dur">0:00</span>
        </div>

    </div>

    <div class="volume-control">
        <span>◀))</span>
        <input
            type="range"
            id="vol"
            min="0"
            max="100"
            value="80"
            aria-label="Volume"
        >
        <span id="volume-number">80</span>
    </div>

</footer>

<audio id="a" preload="metadata"></audio>

<script src="assets/js/player.js"></script>
</body>
</html>
