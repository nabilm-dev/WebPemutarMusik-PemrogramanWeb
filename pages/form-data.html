
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Profile - Ramphony</title>

    <link rel="stylesheet" href="../assets/css/form.css">

    <style>
        /* ===== HEADER PROFILE ===== */

        .profile-header {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px 20px 0;
        }

        .profile-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .profile-header h1 {
            margin: 0;
            color: #B5E4BF;
            font-size: 30px;
            letter-spacing: 2px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 16px;
            border: 1px solid #444;
            border-radius: 999px;

            color: #ffffff;
            font-size: 13px;
            white-space: nowrap;

            transition: background .2s, border-color .2s;
        }

        .back-home:hover {
            background: #303030;
            border-color: #B5E4BF;
            color: #B5E4BF;
        }

        .profile-subtitle {
            margin: 18px 0 0;
            color: #aaaaaa;
            font-size: 14px;
            text-align: left;
        }

        .form-footer {
            padding: 24px;
            color: #aaaaaa;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .profile-header {
                padding: 20px 16px 0;
            }

            .profile-header h1 {
                font-size: 23px;
            }

            .back-home {
                padding: 9px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->

    <header class="profile-header">

        <div class="profile-header-top">

            <h1>Ramphony</h1>

            <a href="../index.html" class="back-home">
                ← Kembali
            </a>

        </div>

        <p class="profile-subtitle">
            Buat profil untuk pengalaman musik yang lebih personal.
        </p>

    </header>


    <!-- ===== CREATE PROFILE FORM ===== -->

    <main>

        <form id="profile-form">

            <fieldset>

                <legend>Profil Pengguna</legend>

                <!-- USERNAME -->

                <p>
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Contoh: ramphony_user"
                        minlength="3"
                        maxlength="20"
                        pattern="[A-Za-z0-9_]+"
                        title="Gunakan huruf, angka, atau underscore"
                        autocomplete="username"
                        required
                    >
                </p>


                <!-- DISPLAY NAME -->

                <p>
                    <label for="display-name">Nama Tampilan</label>

                    <input
                        type="text"
                        id="display-name"
                        name="displayName"
                        placeholder="Contoh: Music Lover"
                        maxlength="30"
                        required
                    >
                </p>


                <!-- FAVORITE ARTIST -->

                <p>
                    <label for="favorite-artist">
                        Band / Artis Favorit
                    </label>

                    <input
                        type="text"
                        id="favorite-artist"
                        name="favoriteArtist"
                        placeholder="Contoh: Rex Orange County"
                        maxlength="80"
                    >
                </p>


                <!-- BIO -->

                <p>
                    <label for="bio">
                        Bio Singkat (Opsional)
                    </label>

                    <textarea
                        id="bio"
                        name="bio"
                        rows="4"
                        maxlength="150"
                        placeholder="Ceritakan sedikit tentang selera musikmu..."
                    ></textarea>
                </p>

            </fieldset>


            <!-- ===== BUTTONS ===== -->

            <div class="actions">

                <button type="submit" id="save-profile">
                    Simpan Profil
                </button>

                <button
                    type="button"
                    class="secondary"
                    id="cancel-profile"
                >
                    Batal
                </button>

            </div>

        </form>

    </main>


    <!-- ===== FOOTER ===== -->

    <footer class="form-footer">
        <p>© 2026 Ramphony</p>
    </footer>


    <!-- ===== JAVASCRIPT ===== -->

    <script>
        const STORAGE_KEY = "ramphony_profile";

        const form = document.getElementById("profile-form");
        const username = document.getElementById("username");
        const displayName = document.getElementById("display-name");
        const favoriteArtist = document.getElementById("favorite-artist");
        const bio = document.getElementById("bio");

        const saveButton = document.getElementById("save-profile");
        const cancelButton = document.getElementById("cancel-profile");


        // ===== LOAD PROFILE =====

        function loadProfile() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (!saved) return;

                const profile = JSON.parse(saved);

                username.value = profile.username || "";
                displayName.value = profile.displayName || "";
                favoriteArtist.value = profile.favoriteArtist || "";
                bio.value = profile.bio || "";

                saveButton.textContent = "Perbarui Profil";

            } catch (error) {
                console.error("Gagal membaca profil:", error);
            }
        }


        // ===== SAVE PROFILE =====

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (!form.reportValidity()) return;

            const profile = {
                username: username.value.trim(),
                displayName: displayName.value.trim(),
                favoriteArtist: favoriteArtist.value.trim(),
                bio: bio.value.trim()
            };

            if (!profile.username || !profile.displayName) {
                alert("Username dan nama tampilan wajib diisi.");
                return;
            }

            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(profile)
                );

                showNotification("Profil berhasil disimpan!");

                saveButton.textContent = "Perbarui Profil";

            } catch (error) {
                console.error("Gagal menyimpan profil:", error);
                alert("Profil gagal disimpan. Coba lagi.");
            }
        });


        // ===== CANCEL =====

        cancelButton.addEventListener("click", function() {
            window.location.href = "../index.html";
        });


        // ===== NOTIFICATION =====

        function showNotification(message) {
            const existing = document.getElementById("profile-overlay");

            if (existing) existing.remove();

            const overlay = document.createElement("div");
            overlay.id = "profile-overlay";

            overlay.style.cssText = `
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
                background: rgba(0,0,0,0.75);
            `;

            const box = document.createElement("div");

            box.style.cssText = `
                width: 100%;
                max-width: 380px;
                padding: 32px;
                background: #202020;
                border-top: 5px solid #B5E4BF;
                border-radius: 18px;
                text-align: center;
                color: white;
                box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            `;

            const icon = document.createElement("div");
            icon.textContent = "✓";

            icon.style.cssText = `
                width: 64px;
                height: 64px;
                line-height: 64px;
                margin: 0 auto 18px;
                border-radius: 50%;
                background: #B5E4BF;
                color: #071b12;
                font-size: 36px;
                font-weight: bold;
            `;

            const title = document.createElement("h2");
            title.textContent = message;
            title.style.marginBottom = "12px";

            const description = document.createElement("p");
            description.textContent =
                "Profil kamu sudah tersimpan di browser ini.";

            description.style.cssText = `
                color: #aaaaaa;
                font-size: 14px;
                margin-bottom: 24px;
            `;

            const button = document.createElement("button");
            button.type = "button";
            button.textContent = "Kembali ke Ramphony";

            button.addEventListener("click", function() {
                window.location.href = "../index.html";
            });

            box.append(icon, title, description, button);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }


        // ===== INITIALIZE =====

        loadProfile();
    </script>

</body>
</html>
