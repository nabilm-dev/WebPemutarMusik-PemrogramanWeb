
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ramphony Lyrics</title>
  <link rel="stylesheet" href="../assets/css/lyrics.css?v=10">
</head>

<body>
  <main class="lyrics-app">

    <!-- HEADER -->
    <header class="lyrics-header">
      <div class="brand">
        <span class="brand-icon">♫</span>
        <span>RAMPHONY</span>
      </div>

      <div class="header-right">
        <span class="mode-label">LYRICS MODE</span>

        <button
          id="close-lyrics"
          class="close-button"
          type="button"
          aria-label="Tutup lyrics"
        >
          &times;
        </button>
      </div>
    </header>

    <!-- LYRICS AREA -->
    <section class="lyrics-screen">

      <div class="song-information">
        <span class="now-playing-label">
          NOW PLAYING
        </span>

        <h1 id="song-title">
          NO TRACK SELECTED
        </h1>
      </div>

      <div id="lyrics-content" class="lyrics-content">
        <div id="lyrics-text" class="lyrics-text">
          Pilih lagu untuk menampilkan lirik.
        </div>
      </div>

    </section>

    <!-- PLAYER FOOTER -->
    <footer class="lyrics-footer">

      <!-- HANYA SATU SET TOMBOL -->
      <div class="lyrics-player-controls">

        <button
          id="lyrics-prev"
          type="button"
          title="Previous"
          aria-label="Lagu sebelumnya"
        >
          ⏮
        </button>

        <button
          id="lyrics-play"
          type="button"
          title="Play / Pause"
          aria-label="Play atau Pause"
        >
          ▶
        </button>

        <button
          id="lyrics-next"
          type="button"
          title="Next"
          aria-label="Lagu berikutnya"
        >
          ⏭
        </button>

      </div>

      <!-- SEEK BAR -->
      <div class="progress-row">

        <div class="time-info">
          <span id="lyrics-current">0:00</span>
          <span class="time-divider">/</span>
          <span id="lyrics-duration">0:00</span>
        </div>

        <input
          id="lyrics-progress"
          type="range"
          min="0"
          max="100"
          step="0.1"
          value="0"
          aria-label="Geser posisi lagu"
        >

        <!-- Dipertahankan untuk kompatibilitas lyrics.js -->
        <div class="footer-actions">

          <label class="upload-link" for="lyrics-file">
            Upload Lyrics
          </label>

          <input
            id="lyrics-file"
            type="file"
            accept=".txt,.lrc"
            hidden
          >

          <button
            id="delete-lyrics"
            type="button"
          >
            Hapus Lyrics
          </button>

        </div>

      </div>

    </footer>

  </main>

  <!-- Semua fungsi Lyrics dan kontrol audio -->
  <script src="../assets/js/lyrics.js"></script>

</body>
</html>
