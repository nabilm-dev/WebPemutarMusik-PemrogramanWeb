
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Ramphony</title>
  <link rel="stylesheet" href="../assets/css/profile.css">
</head>
<body>

  <div class="app">

    <header class="topbar">
      <a href="../index.html" class="back-btn" id="back-to-player-btn">Back to Player</a>
    </header>

    <main class="container">

      <section class="profile-hero">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="avatar" title="Klik untuk mengganti foto profil">
            <span id="avatar-letter">R</span>
            <img id="avatar-img" src="" alt="Profile Avatar" hidden>
            <div class="avatar-overlay">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              <span>Ubah Foto</span>
            </div>
          </div>
          <input type="file" id="direct-avatar-input" accept="image/*" hidden>
        </div>

        <div class="profile-info">
          <h1 id="display-name">Ramphony Listener</h1>
          <p class="username" id="username">@guest</p>
          <p class="bio" id="bio">
            Your music story starts here...
          </p>

          <div class="profile-bottom">
            <span class="artist">
              ♫ Favorite Artist:
              <strong id="artist">Not set yet</strong>
            </span>

            <a href="form-data.html" id="edit-profile-btn" class="edit-btn">
              ✎ Edit Profile
            </a>
            <button type="button" id="auth-action-btn" class="edit-btn" style="cursor: pointer; background: rgba(235, 87, 87, 0.12); color: #ff8585; border: 1px solid rgba(235, 87, 87, 0.3);">
              Keluar (Logout)
            </button>
            <button type="button" id="delete-my-account-btn" class="edit-btn" style="cursor: pointer; background: rgba(235, 87, 87, 0.22); color: #ff4d4d; border: 1px solid rgba(235, 87, 87, 0.45); display: none;">
              🗑️ Hapus Akun Saya
            </button>
            <button type="button" id="public-chat-btn" class="edit-btn" style="cursor: pointer; background: var(--green, #b5e4bf); color: #071b12; font-weight: 700; border: none; display: none;">
              💬 Kirim Pesan
            </button>
          </div>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <strong id="total-songs">0</strong>
          <span>Total Songs</span>
        </div>

        <div class="stat-card">
          <strong id="total-playlists">0</strong>
          <span>Playlists</span>
        </div>

        <div class="stat-card">
          <strong id="total-favorites">0</strong>
          <span>Favorites</span>
        </div>
      </section>



    </main>

    <footer>
      © 2026 Ramphony · Your music, your space.
    </footer>

  </div>

  <script>
    (() => {
      "use strict";

      const PROFILE_KEY = "ramphony_profile";
      const GROUP_KEY = "ramphony_folder_groups_v1";
      const DB_NAME = "ramphony-music-v1";
      const STORE_NAME = "songs";

      const demoSongs = [
        "Rex Orange County - Best Friend",
        "Rex Orange County - Hannah Montana"
      ];

      
      /* ===== IMAGE PROCESSOR (CANVAS RESIZER) ===== */

      function processImageFile(file, callback) {
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxSize = 300;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            callback(dataUrl);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      /* ===== PROFILE ===== */

      function loadProfile() {
        try {
          const params = new URLSearchParams(window.location.search);
          const targetUname = params.get("user") || params.get("u");
          const myUser = JSON.parse(localStorage.getItem("ramphony_user") || "null");
          const isOther = targetUname && (!myUser || targetUname.toLowerCase() !== String(myUser.username || "").toLowerCase());

          let profile = {};

          if (isOther) {
            // Viewing another user's profile
            const regList = JSON.parse(localStorage.getItem("ramphony_registered_accounts") || "[]");
            const found = regList.find(x => x && x.username && x.username.toLowerCase() === targetUname.toLowerCase());
            if (found) {
              profile = { ...found };
            } else {
              profile = {
                username: targetUname,
                displayName: targetUname,
                bio: "Pengguna Ramphony Music.",
                favoriteArtist: "Belum disetel"
              };
            }

            // Adjust UI for other user's profile
            document.title = `${profile.displayName || profile.username} - Profil Ramphony`;
            const editBtn = document.getElementById("edit-profile-btn");
            const authBtn = document.getElementById("auth-action-btn");
            const delBtn = document.getElementById("delete-my-account-btn");
            const chatBtn = document.getElementById("public-chat-btn");
            const avatarOverlay = document.querySelector(".avatar-overlay");

            if (editBtn) editBtn.style.display = "none";
            if (authBtn) authBtn.style.display = "none";
            if (delBtn) delBtn.style.display = "none";
            if (avatarOverlay) avatarOverlay.style.display = "none";

            if (chatBtn) {
              chatBtn.style.display = "inline-flex";
              chatBtn.onclick = () => {
                if (window.parent && window.parent !== window) {
                  window.parent.postMessage({ type: "RAMPHONY_CLOSE_PROFILE" }, "*");
                  window.parent.postMessage({ type: "RAMPHONY_OPEN_CONVO", username: profile.username }, "*");
                }
              };
            }
          } else {
            // Viewing own profile
            const uStr = localStorage.getItem("ramphony_user");
            if (uStr) {
              try { profile = { ...JSON.parse(uStr) }; } catch (e) {}
            }
            const saved = localStorage.getItem(PROFILE_KEY);
            if (saved) {
              try { profile = { ...profile, ...JSON.parse(saved) }; } catch (e) {}
            }
            if (!profile.username && !profile.displayName && !profile.avatar) return;

            const editBtn = document.getElementById("edit-profile-btn");
            if (editBtn) editBtn.style.display = "inline-flex";
            const chatBtn = document.getElementById("public-chat-btn");
            if (chatBtn) chatBtn.style.display = "none";
            const avatarOverlay = document.querySelector(".avatar-overlay");
            if (avatarOverlay) avatarOverlay.style.display = "flex";
          }

          const name =
            profile.displayName ||
            profile.username ||
            "Ramphony Listener";

          document.getElementById("display-name").textContent = name;
          document.getElementById("username").textContent =
            "@" + (profile.username || "guest");

          const avatarLetter = document.getElementById("avatar-letter");
          const avatarImg = document.getElementById("avatar-img");

          if (profile.avatar) {
            if (avatarImg) {
              avatarImg.src = profile.avatar;
              avatarImg.hidden = false;
            }
            if (avatarLetter) avatarLetter.hidden = true;
          } else {
            if (avatarImg) avatarImg.hidden = true;
            if (avatarLetter) {
              avatarLetter.hidden = false;
              avatarLetter.textContent = name.charAt(0).toUpperCase();
            }
          }

          document.getElementById("artist").textContent =
            profile.favoriteArtist || "Not set yet";

          const favs = JSON.parse(localStorage.getItem("ramphony_favorites") || "[]");
          const favElem = document.getElementById("total-favorites");
          if (favElem) favElem.textContent = Array.isArray(favs) ? favs.length : 0;

          // Auth Action Button state (Login vs Logout)
          const authBtn = document.getElementById("auth-action-btn");
          const delMyAccBtn = document.getElementById("delete-my-account-btn");
          const user = JSON.parse(localStorage.getItem("ramphony_user") || "null");

          if (delMyAccBtn) {
            if (user) {
              delMyAccBtn.style.display = "inline-flex";
              delMyAccBtn.onclick = () => {
                if (!confirm("⚠️ PERINGATAN: Apakah kamu yakin ingin menghapus akun ini secara permanen? Akun kamu akan dihapus dari database dan kamu akan langsung keluar.")) return;

                if (window.parent && window.parent !== window) {
                  window.parent.postMessage({ type: "RAMPHONY_DELETE_CURRENT_ACCOUNT", user }, "*");
                  window.parent.postMessage({ type: "RAMPHONY_CLOSE_PROFILE" }, "*");
                } else {
                  localStorage.removeItem("ramphony_user");
                  localStorage.removeItem("ramphony_profile");
                  localStorage.removeItem("ramphony_registered_accounts");
                  window.location.href = "../index.html";
                }
              };
            } else {
              delMyAccBtn.style.display = "none";
            }
          }

          if (authBtn) {
            if (user) {
              authBtn.textContent = "Keluar (Logout)";
              authBtn.style.color = "#ff8585";
              authBtn.style.background = "rgba(235, 87, 87, 0.12)";
              authBtn.style.borderColor = "rgba(235, 87, 87, 0.3)";
              authBtn.onclick = () => {
                // Clear all session & account cache
                localStorage.removeItem("ramphony_user");
                localStorage.removeItem("ramphony_profile");
                localStorage.removeItem("ramphony_registered_accounts");
                localStorage.removeItem("ramphony_user_chat_threads_v3");
                sessionStorage.clear();

                if (window.parent && window.parent !== window) {
                  try {
                    window.parent.postMessage({ type: "RAMPHONY_TRIGGER_LOGOUT" }, "*");
                    window.parent.postMessage({ type: "RAMPHONY_CLOSE_PROFILE" }, "*");
                  } catch (e) {}
                } else {
                  window.location.href = "../index.html";
                }
              };
            } else {
              authBtn.textContent = "Masuk / Daftar";
              authBtn.style.color = "#b5e4bf";
              authBtn.style.background = "rgba(181, 228, 191, 0.12)";
              authBtn.style.borderColor = "rgba(181, 228, 191, 0.3)";
              authBtn.onclick = () => {
                if (window.parent && window.parent !== window) {
                  try {
                    window.parent.postMessage({ type: "RAMPHONY_CLOSE_PROFILE" }, "*");
                    window.parent.postMessage({ type: "RAMPHONY_OPEN_AUTH" }, "*");
                  } catch (e) {}
                } else {
                  window.location.href = "../index.html";
                }
              };
            }
          }

          document.getElementById("bio").textContent =
            profile.bio || "Your music story starts here...";

        } catch (error) {
          console.warn("Profil tidak dapat dibaca:", error);
        }
      }

      
      /* ===== DIRECT AVATAR UPLOAD ===== */

      const directAvatarInput = document.getElementById("direct-avatar-input");
      const avatarBtn = document.getElementById("avatar");

      avatarBtn?.addEventListener("click", () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("user") || params.get("u")) return; // Cannot edit others' photos
        directAvatarInput?.click();
      });

      directAvatarInput?.addEventListener("change", e => {
        const file = e.target.files?.[0];
        if (!file) return;
        processImageFile(file, dataUrl => {
          try {
            const saved = localStorage.getItem(PROFILE_KEY);
            const userStr = localStorage.getItem("ramphony_user");
            const uObj = userStr ? JSON.parse(userStr) : {};
            const profile = saved ? JSON.parse(saved) : {};
            profile.avatar = dataUrl;
            if (!profile.username && uObj.username) profile.username = uObj.username;
            if (!profile.displayName && uObj.displayName) profile.displayName = uObj.displayName;
            if (!profile.email && uObj.email) profile.email = uObj.email;
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));

            uObj.avatar = dataUrl;
            localStorage.setItem("ramphony_user", JSON.stringify(uObj));

            // Sync with ramphony_registered_accounts so friends see the new avatar
            try {
              const regStr = localStorage.getItem("ramphony_registered_accounts");
              if (regStr) {
                const regList = JSON.parse(regStr);
                if (Array.isArray(regList)) {
                  regList.forEach(item => {
                    if (item && (
                      (profile.username && String(item.username).toLowerCase() === String(profile.username).toLowerCase()) ||
                      (profile.email && item.email === profile.email)
                    )) {
                      item.avatar = dataUrl;
                    }
                  });
                  localStorage.setItem("ramphony_registered_accounts", JSON.stringify(regList));
                }
              }
            } catch (e) {}

            try {
              window.parent.postMessage({ type: "RAMPHONY_PROFILE_UPDATED", profile }, "*");
            } catch (e) {}
            loadProfile();
          } catch (err) {
            alert("Gagal menyimpan foto profil.");
          }
        });
      });

      /* ===== INDEXEDDB ===== */

      function getSavedSongs() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB tidak didukung"));
            return;
          }

          const request = indexedDB.open(DB_NAME, 1);

          request.onerror = () => reject(request.error);

          request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, {
                keyPath: "id"
              });
            }
          };

          request.onsuccess = () => {
            const db = request.result;

            const transaction = db.transaction(
              STORE_NAME,
              "readonly"
            );

            const store = transaction.objectStore(STORE_NAME);
            const songsRequest = store.getAll();

            songsRequest.onsuccess = () => {
              resolve(songsRequest.result || []);
            };

            songsRequest.onerror = () => {
              reject(songsRequest.error);
            };

            transaction.oncomplete = () => db.close();
          };
        });
      }

      /* ===== PLAYLISTS COUNT ===== */

      function getPlaylistsCount() {
        try {
          const custom = JSON.parse(
            localStorage.getItem("ramphony_custom_playlists_v1") || "[]"
          );
          const groups = JSON.parse(
            localStorage.getItem(GROUP_KEY) || "[]"
          );
          const cCount = Array.isArray(custom) ? custom.length : 0;
          const gCount = Array.isArray(groups) ? groups.length : 0;
          return cCount + gCount;
        } catch {
          return 0;
        }
      }

      /* ===== LOAD STATS ===== */

      async function loadStats() {
        try {
          const records = await getSavedSongs();
          const playlistCount = getPlaylistsCount();

          const songs = records
            .filter(record => record && record.name)
            .sort(
              (a, b) =>
                (a.addedAt || 0) - (b.addedAt || 0)
            );

          const totalSongsEl = document.getElementById("total-songs");
          if (totalSongsEl) {
            totalSongsEl.textContent = songs.length + demoSongs.length;
          }

          const totalPlaylistsEl = document.getElementById("total-playlists");
          if (totalPlaylistsEl) {
            totalPlaylistsEl.textContent = playlistCount;
          }

          const favs = JSON.parse(localStorage.getItem("ramphony_favorites") || "[]");
          const totalFavsEl = document.getElementById("total-favorites");
          if (totalFavsEl) {
            totalFavsEl.textContent = Array.isArray(favs) ? favs.length : 0;
          }
        } catch (error) {
          console.error("Gagal membaca statistik:", error);
        }
      }

      loadProfile();
      loadStats();

      // Auto refresh on focus, storage change, or parent message
      window.addEventListener("storage", () => {
        loadProfile();
        loadStats();
      });
      window.addEventListener("focus", () => {
        loadProfile();
        loadStats();
      });
      window.addEventListener("message", event => {
        if (event.data?.type === "RAMPHONY_REFRESH_PROFILE") {
          loadProfile();
          loadStats();
        }
      });

    })();
  </script>

    <!-- OVERLAY NAVIGATION: close overlay when inside index.html iframe -->
  <script>
    (function () {
      "use strict";

      function sendToParent(type) {
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({ type: type }, "*");
          } catch (e) {
            console.error("Failed to postMessage:", e);
          }
        }
      }

      const backBtn = document.getElementById("back-to-player-btn") || document.querySelector(".back-btn");
      if (backBtn) {
        backBtn.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          if (window.parent && window.parent !== window) {
            sendToParent("RAMPHONY_CLOSE_PROFILE");
          } else {
            window.location.href = "../index.html";
          }
        });
      }

      const isEmbedded = window.parent !== window;
      if (!isEmbedded) return;

      document.addEventListener('click', function (event) {
        const link = event.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href) return;

        /* Back to Player -> close profile overlay */
        if (link.classList.contains('back-btn') || href.includes('index.html')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          sendToParent('RAMPHONY_CLOSE_PROFILE');
          return;
        }

        /* Edit Profile -> load form-data inside this same iframe */
        if (href.includes('form-data.html')) {
          return;
        }

        /* Playlist link */
        if (href.includes('playlist.html')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          sendToParent('RAMPHONY_OPEN_PLAYLIST');
          return;
        }
      }, true);
    })();
  </script>

</body>
</html>
