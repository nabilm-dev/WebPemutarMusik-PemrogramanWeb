
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Ramphony</title>
  <link rel="stylesheet" href="../assets/css/profile.css">
</head>
<body>

  <div class="app">

    <header class="topbar">
      <a href="../index.html" class="back-btn">Back to Player</a>
    </header>

    <main class="container">

      <section class="profile-hero">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="avatar" title="Klik untuk mengganti foto profil">
            <span id="avatar-letter">R</span>
            <img id="avatar-img" src="" alt="Profile Avatar" hidden>
            <div class="avatar-overlay">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              <span>Ubah Foto</span>
            </div>
          </div>
          <input type="file" id="direct-avatar-input" accept="image/*" hidden>
        </div>

        <div class="profile-info">
          <h1 id="display-name">Ramphony Listener</h1>
          <p class="username" id="username">@guest</p>
          <p class="bio" id="bio">
            Your music story starts here...
          </p>

          <div class="profile-bottom">
            <span class="artist">
              ♫ Favorite Artist:
              <strong id="artist">Not set yet</strong>
            </span>

            <a href="form-data.html" class="edit-btn">
              ✎ Edit Profile
            </a>
          </div>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <strong id="total-songs">0</strong>
          <span>Total Songs</span>
        </div>

        <div class="stat-card">
          <strong id="total-playlists">0</strong>
          <span>Playlists</span>
        </div>

        <div class="stat-card">
          <strong id="total-favorites">0</strong>
          <span>Favorites</span>
        </div>
      </section>



    </main>

    <footer>
      © 2026 Ramphony · Your music, your space.
    </footer>

  </div>

  <script>
    (() => {
      "use strict";

      const PROFILE_KEY = "ramphony_profile";
      const GROUP_KEY = "ramphony_folder_groups_v1";
      const DB_NAME = "ramphony-music-v1";
      const STORE_NAME = "songs";

      const demoSongs = [
        "Rex Orange County - Best Friend",
        "Rex Orange County - Hannah Montana"
      ];

      
      /* ===== IMAGE PROCESSOR (CANVAS RESIZER) ===== */

      function processImageFile(file, callback) {
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxSize = 300;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            callback(dataUrl);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      /* ===== PROFILE ===== */

      function loadProfile() {
        try {
          const saved = localStorage.getItem(PROFILE_KEY);
          if (!saved) return;

          const profile = JSON.parse(saved);

          const name =
            profile.displayName ||
            profile.username ||
            "Ramphony Listener";

          document.getElementById("display-name").textContent = name;
          document.getElementById("username").textContent =
            "@" + (profile.username || "guest");

          const avatarLetter = document.getElementById("avatar-letter");
          const avatarImg = document.getElementById("avatar-img");

          if (profile.avatar) {
            if (avatarImg) {
              avatarImg.src = profile.avatar;
              avatarImg.hidden = false;
            }
            if (avatarLetter) avatarLetter.hidden = true;
          } else {
            if (avatarImg) avatarImg.hidden = true;
            if (avatarLetter) {
              avatarLetter.hidden = false;
              avatarLetter.textContent = name.charAt(0).toUpperCase();
            }
          }

          document.getElementById("artist").textContent =
            profile.favoriteArtist || "Not set yet";

          const favs = JSON.parse(localStorage.getItem("ramphony_favorites") || "[]");
          const favElem = document.getElementById("total-favorites");
          if (favElem) favElem.textContent = Array.isArray(favs) ? favs.length : 0;

          document.getElementById("bio").textContent =
            profile.bio || "Your music story starts here...";

        } catch (error) {
          console.warn("Profil tidak dapat dibaca:", error);
        }
      }

      
      /* ===== DIRECT AVATAR UPLOAD ===== */

      const directAvatarInput = document.getElementById("direct-avatar-input");
      const avatarBtn = document.getElementById("avatar");

      avatarBtn?.addEventListener("click", () => {
        directAvatarInput?.click();
      });

      directAvatarInput?.addEventListener("change", e => {
        const file = e.target.files?.[0];
        if (!file) return;
        processImageFile(file, dataUrl => {
          try {
            const saved = localStorage.getItem(PROFILE_KEY);
            const profile = saved ? JSON.parse(saved) : {};
            profile.avatar = dataUrl;
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            loadProfile();
          } catch (err) {
            alert("Gagal menyimpan foto profil.");
          }
        });
      });

      /* ===== INDEXEDDB ===== */

      function getSavedSongs() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB tidak didukung"));
            return;
          }

          const request = indexedDB.open(DB_NAME, 1);

          request.onerror = () => reject(request.error);

          request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, {
                keyPath: "id"
              });
            }
          };

          request.onsuccess = () => {
            const db = request.result;

            const transaction = db.transaction(
              STORE_NAME,
              "readonly"
            );

            const store = transaction.objectStore(STORE_NAME);
            const songsRequest = store.getAll();

            songsRequest.onsuccess = () => {
              resolve(songsRequest.result || []);
            };

            songsRequest.onerror = () => {
              reject(songsRequest.error);
            };

            transaction.oncomplete = () => db.close();
          };
        });
      }

      /* ===== FOLDER GROUPS ===== */

      function getGroups() {
        try {
          const saved = JSON.parse(
            localStorage.getItem(GROUP_KEY) || "[]"
          );

          return Array.isArray(saved) ? saved : [];
        } catch {
          return [];
        }
      }

      /* ===== LOAD STATS ===== */

      async function loadStats() {
        try {
          const records = await getSavedSongs();
          const groups = getGroups();

          const songs = records
            .filter(record => record && record.name)
            .sort(
              (a, b) =>
                (a.addedAt || 0) - (b.addedAt || 0)
            );

          const totalSongsEl = document.getElementById("total-songs");
          if (totalSongsEl) {
            totalSongsEl.textContent = songs.length + demoSongs.length;
          }

          const totalPlaylistsEl = document.getElementById("total-playlists");
          if (totalPlaylistsEl) {
            totalPlaylistsEl.textContent = groups.length;
          }
        } catch (error) {
          console.error("Gagal membaca statistik:", error);
        }
      }

      loadProfile();
      loadStats();

    })();
  </script>

  <!-- OVERLAY NAVIGATION: close overlay when inside index.html iframe -->
  <script>
    (function () {
      "use strict";

      const isEmbedded = window.parent !== window;
      if (!isEmbedded) return;

      function sendToParent(type) {
        window.parent.postMessage({ type: type }, window.location.origin);
      }

      document.addEventListener('click', function (event) {
        const link = event.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href) return;
        let url;
        try { url = new URL(href, document.baseURI); } catch { return; }
        if (url.origin !== location.origin) return;
        const path = url.pathname;

        /* Back to Player -> close profile overlay */
        if (path.endsWith('/index.html')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          sendToParent('RAMPHONY_CLOSE_PROFILE');
          return;
        }

        /* Edit Profile -> load form-data inside this same iframe */
        if (path.endsWith('/pages/form-data.html')) {
          return;
        }

        /* Playlist link */
        if (path.endsWith('/pages/playlist.html')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          sendToParent('RAMPHONY_OPEN_PLAYLIST');
          return;
        }
      }, true);
    })();
  </script>

</body>
</html>
